<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acinema</title><style>
:root{--g:#d4af37;--b:#090909;--p:#171717;--t:#f4f1e9;--m:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Tahoma,Arial}.c{max-width:1200px;margin:auto;padding:0 18px}header{height:72px;border-bottom:1px solid #342b15;display:flex;align-items:center;justify-content:space-between}.logo{font:2rem Georgia;color:var(--g)}.logo b{font-size:2.8rem}.logo small{color:#fff;font:1.2rem Tahoma}nav a{color:#ddd;text-decoration:none;margin-right:17px}.hero{min-height:390px;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 73% 37%,#4b3915,transparent 28%),linear-gradient(90deg,#090909,#09090988,#090909)}.quote{font:clamp(1.2rem,2.8vw,2.2rem) Georgia;line-height:1.55;color:#ddd}.quote span{display:block}.quote span+span{margin-top:4px}.quote em{display:block;margin-bottom:14px;color:var(--g);font:700 .8rem Tahoma;font-style:normal;letter-spacing:1px}main{padding:42px 0}h2{color:var(--g)}.search{width:100%;padding:14px;border:1px solid #4a4027;border-radius:8px;background:var(--p);color:#fff;font:inherit}.group{margin:20px 0}.group b{display:block;color:#ddd;margin-bottom:8px}.chip{border:1px solid #4a4027;border-radius:99px;background:#171717;color:#ddd;padding:8px 13px;margin:3px;cursor:pointer}.chip.on,.chip:hover{background:var(--g);color:#111;border-color:var(--g)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card{cursor:pointer}.poster{height:245px;border:1px solid #534522;border-radius:9px;background:var(--bg);display:flex;align-items:end;padding:13px;box-shadow:inset 0 -85px 55px #000b}.poster strong{font:1.1rem Georgia}.card p{margin:7px 0 0;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:#aaa}.empty{display:none;color:#aaa;padding:30px;text-align:center}footer{text-align:center;color:#aaa;border-top:1px solid #342b15;padding:22px}@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:550px){nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}.poster{height:220px}}
</style></head><body><header class="c"><div class="logo"><b>A</b><small>cinema</small></div><nav><a href="index.html">أدواتي</a><a href="#catalog">استكشف</a></nav></header><section class="hero"><div class="c quote"><em>ACINEMA</em><span>But It's hard to stay mad,</span><span>when there's so much beauty in the world</span></div></section><main class="c" id="catalog"><h2>استكشف الأعمال</h2><input id="q" class="search" placeholder="ابحث عن فيلم أو مسلسل…"><div class="group"><b>اللغة</b><div id="lang"><button class="chip on" data-x="all">كل اللغات</button><button class="chip" data-x="اجنبي">أجنبي</button><button class="chip" data-x="عربي">عربي</button><button class="chip" data-x="اسباني">إسباني</button><button class="chip" data-x="كيدراما">كيدراما</button><button class="chip" data-x="ايطالي">إيطالي</button><button class="chip" data-x="تركي">تركي</button><button class="chip" data-x="فارسي">فارسي</button><button class="chip" data-x="كردي">كردي</button></div></div><div class="group"><b>النوع</b><div id="genre"><button class="chip on" data-x="all">كل الأنواع</button><button class="chip" data-x="اكشن">أكشن</button><button class="chip" data-x="اثارة">إثارة</button><button class="chip" data-x="رعب">رعب</button><button class="chip" data-x="كوميدي">كوميدي</button><button class="chip" data-x="دراما">دراما</button><button class="chip" data-x="وثائقي">وثائقي</button><button class="chip" data-x="انمي">أنمي</button><button class="chip" data-x="نتفلكس">نتفلكس</button></div></div><div class="grid" id="grid"></div><div class="empty" id="empty">لا توجد نتائج بهذه المواصفات.</div></main><footer>© 2026 Acinema · 🇮🇶<br>قبلة المطوّر</footer><script>
const d=[['Dune: Part Two','اجنبي','اكشن','#a7662a'],['Yargı','تركي','دراما','#365363'],['Culpa Mía','اسباني','كوميدي','#a64357'],['The Glory','كيدراما','اثارة','#3e304e'],['Oppenheimer','اجنبي','دراما','#a54c1e'],['Encanto','اجنبي','كوميدي','#7043a0'],['The Godfather','ايطالي','دراما','#5c452d'],['Attack on Titan','اجنبي','انمي','#394637'],['Free Solo','اجنبي','وثائقي','#426478'],['The Last of Us','اجنبي','نتفلكس','#446a52'],['الفيل الأزرق','عربي','اثارة','#27405a'],['آفساينه','كردي','دراما','#754831']];let l='all',g='all';const grid=document.querySelector('#grid'),q=document.querySelector('#q');function draw(){let a=d.filter(x=>(l==='all'||x[1]===l)&&(g==='all'||x[2]===g)&&x.join(' ').toLowerCase().includes(q.value.toLowerCase()));grid.innerHTML=a.map(x=>'<article class="card"><div class="poster" style="--bg:linear-gradient(145deg,'+x[3]+',#111)"><strong>'+x[0]+'</strong></div><p>'+x[0]+'</p><small>'+x[1]+' · '+x[2]+'</small></article>').join('');empty.style.display=a.length?'none':'block'}function bind(id,set){document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{set(b.dataset.x);document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.toggle('on',x===b));draw()})}bind('lang',x=>l=x);bind('genre',x=>g=x);q.oninput=draw;draw();
</script><script>document.querySelector('.quote span').textContent="But It's hard to stay mad";</script></body></html>
